version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: nest-api-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: nest-api-db
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - nest-api-network

volumes:
  mongo_data:
    driver: local

networks:
  nest-api-network:
    driver: bridge
